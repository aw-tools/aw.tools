name: Site

# Checks, builds and indexes the site on every pull request, and deploys it to
# GitHub Pages on a push to main. The build runs the same just recipe as a local
# one, so the Zola and Pagefind versions come from the justfile alone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

permissions:
  contents: read

# Pull request runs are cancelled by a newer push; deploys are serialised
# rather than cancelled, so a deploy under way always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Install dprint
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: dprint@0.55.2

      - name: Check formatting
        run: just fmt

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Build and index the site
        run: just build

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: public

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version

      - name: Lint the workflows
        run: just actionlint

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - fmt
      - build
      - workflows
    if: always()
    steps:
      - name: Check all jobs
        run: |
          # The aggregate is the required check, so adding a job above is a
          # workflow change alone and never a branch-protection change.
          results=("${{ needs.fmt.result }}" "${{ needs.build.result }}" "${{ needs.workflows.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "success" ]]; then continue; fi
            echo "Job failed with result: $r"
            exit 1
          done

  # Deploys only what passed the whole gate.
  deploy:
    name: Deploy
    needs:
      - ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
