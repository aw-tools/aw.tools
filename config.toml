base_url = "https://aw.tools"
title = "Agentic Workspace"
description = "aw keeps the record of software work (decisions, findings, next steps) in a git repository beside your code, so the next session starts where the last one stopped."
compile_sass = false
build_search_index = false

# Class mode, so the colours come from static/css/code.css and the tokens; the
# theme only decides which scopes share a class number.
[markdown.highlighting]
style = "class"
theme = "github-light"

[link_checker]
# GitHub rewrites heading anchors in the browser, so a working link such as
# lore#install reads as broken to the checker.
skip_anchor_prefixes = ["https://github.com/"]

[extra]
# Cloudflare Web Analytics site token; public by design, it ships in every
# page. Empty switches analytics off.
analytics_token = "75a02738656e43d19067039781bc9311"
