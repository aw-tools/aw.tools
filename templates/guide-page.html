{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ page.title }}</h1>
{{ page.content | safe }}
<nav class="pager" aria-label="Chapters">
  {% if page.lower %}<a class="prev" href="{{ page.lower.permalink }}"><small>← Previous</small>{{ page.lower.title }}</a>{% endif %}
  {% if page.higher %}<a class="next" href="{{ page.higher.permalink }}"><small>Next →</small>{{ page.higher.title }}</a>{% endif %}
</nav>
{% endblock %}
